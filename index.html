<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aphelion Ground Station — Dual Vehicle</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0e1015;
    --panel: #12141a;
    --panel-2: #0a0c10;
    --border: #23262f;
    --text: #e6e8ee;
    --text-dim: #9aa0ab;
    --accent-cansat: #2563eb;
    --accent-rocket: #dc2626;
    --accent-soft-cansat: rgba(37, 99, 235, 0.15);
    --accent-soft-rocket: rgba(220, 38, 38, 0.15);
    --safe: #86efac;
    --danger: #fca5a5;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Roboto Mono", monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 12px; background: var(--bg); color: var(--text);
    font-family: var(--sans);
  }

  h1 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
  
  .header-wrapper {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; gap: 12px;
  }

  .logo-section {
    display: flex; align-items: center; gap: 12px;
  }

  .logo-section img { height: 52px; object-fit: contain; }

  .dualGrid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    margin-bottom: 16px;
  }

  @media (max-width: 900px) { 
    .dualGrid { grid-template-columns: 1fr; }
    .header-wrapper { flex-direction: column; }
  }

  .shared-map-container {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 16px;
  }

  .shared-map-title {
    font-size: 14px; font-weight: 600; margin-bottom: 10px;
  }

  #sharedMap { height: 380px; border-radius: 8px; }

  .side {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
  }

  .side.cansat { border-top: 3px solid var(--accent-cansat); }
  .side.rocket { border-top: 3px solid var(--accent-rocket); }

  .sideTitle { 
    font-size: 15px; font-weight: 700; margin-bottom: 10px; 
    display: flex; align-items: center; gap: 8px; 
  }

  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .side.cansat .dot { background: var(--accent-cansat); }
  .side.rocket .dot { background: var(--accent-rocket); }

  .topbar { 
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px; 
    flex-wrap: wrap; 
  }

  button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px;
    font-family: var(--sans); font-weight: 600;
  }

  .side.cansat button { background: var(--accent-cansat); color: white; border: none; }
  .side.rocket button { background: var(--accent-rocket); color: white; border: none; }

  button:hover { filter: brightness(1.15); }

  select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px; font-size: 13px; font-family: var(--mono);
  }

  .status { 
    font-size: 12px; padding: 3px 9px; border-radius: 12px; 
    font-family: var(--mono);
  }

  .status.connected { background: rgba(134, 239, 172, 0.15); color: var(--safe); }
  .status.disconnected { background: rgba(252, 165, 165, 0.15); color: var(--danger); }

  .grid { 
    display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); 
    gap: 8px; margin-bottom: 12px; 
  }

  .card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px;
  }

  .card .label { 
    font-size: 10px; color: var(--text-dim); text-transform: uppercase; 
    letter-spacing: 0.04em; font-family: var(--mono);
  }

  .card .value { font-size: 16px; font-weight: 600; margin-top: 2px; font-family: var(--mono); }
  .card .value.small { font-size: 12px; }

  #cansat-map, #rocket-map { height: 200px; border-radius: 8px; margin-bottom: 12px; }

  .horizonWrap { 
    display: flex; justify-content: center; margin-bottom: 12px; 
  }

  canvas.horizon { background: var(--panel-2); border-radius: 8px; border: 1px solid var(--border); }

  .gauges {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; 
    margin-bottom: 12px; padding: 8px 0;
  }

  .gauge-box {
    display: flex; flex-direction: column; align-items: center;
  }

  .gauge-box svg { width: 100%; max-width: 140px; }

  .gauge-readout {
    text-align: center; margin-top: -4px;
  }

  .gauge-readout .val { 
    font-family: var(--mono); font-size: 18px; font-weight: 600;
  }

  .gauge-readout .unit { 
    font-family: var(--mono); font-size: 10px; color: var(--text-dim); 
  }

  .gauge-readout .lbl { 
    font-size: 10px; color: var(--text-dim); margin-top: 1px; 
  }

  .pyro-badge {
    padding: 8px 12px; border-radius: 6px;
    font-family: var(--mono); font-size: 12px; text-align: center;
    margin-bottom: 12px;
  }

  .side.cansat .pyro-badge { 
    background: var(--accent-soft-cansat); color: var(--safe); 
    border: 1px solid var(--accent-cansat);
  }

  .side.rocket .pyro-badge { 
    background: var(--accent-soft-rocket); color: var(--danger); 
    border: 1px solid var(--accent-rocket);
  }

  .pyro-badge.fired { 
    animation: pulse 1.1s infinite; 
  }

  @keyframes pulse { 
    0%, 100% { opacity: 1; } 
    50% { opacity: 0.55; } 
  }

  .chartWrap { position: relative; height: 140px; margin-bottom: 12px; }

  .log {
    height: 100px; overflow-y: auto; background: var(--panel-2); 
    border-radius: 8px; padding: 6px; font-family: var(--mono); 
    font-size: 10px; color: #7dd3fc; white-space: pre-wrap;
    border: 1px solid var(--border);
  }

  .packetInfo { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }

  .video-section {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
  }

  .video-section-title {
    font-size: 13px; margin-bottom: 8px; color: var(--text-dim);
  }

  video {
    width: 100%; max-height: 240px; background: #000; border-radius: 8px;
    border: 1px solid var(--border);
  }

  .scale-row {
    display: flex; align-items: center; gap: 6px; font-size: 10px; 
    color: var(--text-dim); padding: 2px 8px; margin-bottom: 6px;
  }

  .scale-row input {
    width: 56px; background: var(--panel-2); border: 1px solid var(--border); 
    color: var(--text); border-radius: 4px; padding: 2px 4px; 
    font-family: var(--mono); font-size: 11px;
  }
</style>
</head>
<body>

<!-- ============== HEADER ============== -->
<div class="header-wrapper">
  <div class="logo-section">
    <img src="A.png" alt="Aphelion Logo" style="height:52px; object-fit:contain;">
    <h1 style="margin:0;">Aphelion Ground Station</h1>
  </div>
  <img id="ITB_LOGO" src="ITBLOGO.png" alt="ITB Logo" style="height:52px; max-width:160px; object-fit:contain;">
</div>

<!-- ============== SHARED MAP ============== -->
<div class="shared-map-container">
  <div class="shared-map-title">🗺️ Live Map: 🛰️ CanSat &nbsp;/&nbsp; 🚀 Rocket</div>
  <div id="sharedMap"></div>
</div>

<!-- ============== DUAL VEHICLE PANELS ============== -->
<div class="dualGrid">

  <!-- ================= CANSAT PANEL ================= -->
  <div class="side cansat">
    <div class="sideTitle"><span class="dot"></span> CanSat</div>
    <div class="topbar">
      <button id="cansat-connectBtn">Connect Serial</button>
      <select id="cansat-baudSelect">
        <option value="9600" selected>9600</option>
        <option value="19200">19200</option>
        <option value="57600">57600</option>
        <option value="115200">115200</option>
      </select>
      <span id="cansat-statusPill" class="status disconnected">Disconnected</span>
      <span id="cansat-packetInfo" class="packetInfo"></span>
    </div>

    <!-- Key Metrics -->
    <div class="grid">
      <div class="card"><div class="label">Alt (GPS)</div><div class="value" id="cansat-valGpsAlt">--</div></div>
      <div class="card"><div class="label">Alt (baro)</div><div class="value" id="cansat-valBaroAlt">--</div></div>
      <div class="card"><div class="label">Sats</div><div class="value" id="cansat-valSats">--</div></div>
      <div class="card"><div class="label">Pressure</div><div class="value small" id="cansat-valPress">--</div></div>
      <div class="card"><div class="label">Temp</div><div class="value small" id="cansat-valTemp">--</div></div>
      <div class="card"><div class="label">R/P/Y</div><div class="value small" id="cansat-valAttitude">--</div></div>
    </div>

    <!-- Horizon Indicator -->
    <div class="horizonWrap"><canvas class="horizon" id="cansat-horizon" width="200" height="200"></canvas></div>

    <!-- Altitude Chart -->
    <div class="chartWrap"><canvas id="cansat-altChart"></canvas></div>

    <!-- Gauges -->
    <div class="gauges" id="cansat-gauges"></div>

    <!-- Log -->
    <div class="log" id="cansat-log"></div>

    <!-- Video Section (CanSat only) -->
    <div class="video-section">
      <div class="video-section-title">📹 Live Video (VTX/VRX via capture card)</div>
      <div class="topbar">
        <button id="cansat-videoEnableBtn">Enable camera list</button>
        <select id="cansat-videoDeviceSelect" style="flex:1; min-width:150px;"><option>Click "Enable camera list" first</option></select>
      </div>
      <video id="cansat-fpvVideo" autoplay playsinline muted></video>
    </div>
  </div>

  <!-- ================= ROCKET PANEL ================= -->
  <div class="side rocket">
    <div class="sideTitle"><span class="dot"></span> Rocket</div>
    <div class="topbar">
      <button id="rocket-connectBtn">Connect Serial</button>
      <select id="rocket-baudSelect">
        <option value="9600" selected>9600</option>
        <option value="19200">19200</option>
        <option value="57600">57600</option>
        <option value="115200">115200</option>
      </select>
      <span id="rocket-statusPill" class="status disconnected">Disconnected</span>
      <span id="rocket-packetInfo" class="packetInfo"></span>
    </div>

    <!-- Key Metrics -->
    <div class="grid">
      <div class="card"><div class="label">Alt (GPS)</div><div class="value" id="rocket-valGpsAlt">--</div></div>
      <div class="card"><div class="label">Alt (baro)</div><div class="value" id="rocket-valBaroAlt">--</div></div>
      <div class="card"><div class="label">Sats</div><div class="value" id="rocket-valSats">--</div></div>
      <div class="card"><div class="label">Pressure</div><div class="value small" id="rocket-valPress">--</div></div>
      <div class="card"><div class="label">Temp</div><div class="value small" id="rocket-valTemp">--</div></div>
      <div class="card"><div class="label">R/P/Y</div><div class="value small" id="rocket-valAttitude">--</div></div>
    </div>

    <!-- Pyro Status Badge -->
    <div class="pyro-badge" id="rocket-pyroBadge">PYRO — Safe</div>

    <!-- Horizon Indicator -->
    <div class="horizonWrap"><canvas class="horizon" id="rocket-horizon" width="200" height="200"></canvas></div>

    <!-- Gauges -->
    <div class="gauges" id="rocket-gauges"></div>

    <!-- Altitude Chart -->
    <div class="chartWrap"><canvas id="rocket-altChart"></canvas></div>

    <!-- Log -->
    <div class="log" id="rocket-log"></div>
  </div>

</div>

<script>
// ============== SHARED MAP SETUP ==============
const sharedMap = L.map('sharedMap').setView([-6.9, 107.6], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(sharedMap);

function emojiIcon(emoji) {
  return L.divIcon({
    html: `<div style="font-size:26px; line-height:26px; text-align:center; filter: drop-shadow(0 0 3px #000);">${emoji}</div>`,
    className: '',
    iconSize: [26, 26],
    iconAnchor: [13, 13]
  });
}

// ============== GAUGE BUILDER ==============
function buildGauge(container, title, unit, min, max, decimals = 1) {
  const html = `
    <div class="gauge-box">
      <svg viewBox="0 0 200 200" style="width:100%; max-width:120px;">
        <defs>
          <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
          </linearGradient>
        </defs>
        <circle cx="100" cy="100" r="85" fill="none" stroke="#1c1f27" stroke-width="2"/>
        <path d="M 30 150 A 70 70 0 0 1 170 150" fill="none" stroke="#23262f" stroke-width="3"/>
        <g class="needle" style="transform-origin: 100px 100px;">
          <line x1="100" y1="100" x2="100" y2="35" stroke="#e6e8ee" stroke-width="2" stroke-linecap="round"/>
        </g>
        <circle cx="100" cy="100" r="6" fill="#e6e8ee"/>
      </svg>
      <div class="gauge-readout">
        <div class="val" data-val="--">--</div>
        <div class="unit">${unit}</div>
        <div class="lbl">${title}</div>
      </div>
    </div>
  `;
  container.insertAdjacentHTML('beforeend', html);
  
  const valEl = container.querySelector('.gauge-box:last-child .val');
  const needle = container.querySelector('.gauge-box:last-child .needle');
  
  return {
    update: (value) => {
      const clamped = Math.max(min, Math.min(max, value));
      const angle = -135 + ((clamped - min) / (max - min)) * 270;
      needle.style.transform = `rotate(${angle}deg)`;
      valEl.textContent = value.toFixed(decimals);
      valEl.setAttribute('data-val', value.toFixed(decimals));
    }
  };
}

// ============== MAIN DASHBOARD FACTORY ==============
function createDashboard(prefix, lineColor, emoji, theme) {
  const els = {
    connectBtn: document.getElementById(`${prefix}-connectBtn`),
    baudSelect: document.getElementById(`${prefix}-baudSelect`),
    statusPill: document.getElementById(`${prefix}-statusPill`),
    packetInfo: document.getElementById(`${prefix}-packetInfo`),
    valGpsAlt: document.getElementById(`${prefix}-valGpsAlt`),
    valBaroAlt: document.getElementById(`${prefix}-valBaroAlt`),
    valSats: document.getElementById(`${prefix}-valSats`),
    valPress: document.getElementById(`${prefix}-valPress`),
    valTemp: document.getElementById(`${prefix}-valTemp`),
    valAttitude: document.getElementById(`${prefix}-valAttitude`),
    horizon: document.getElementById(`${prefix}-horizon`),
    log: document.getElementById(`${prefix}-log`),
    gaugesContainer: document.getElementById(`${prefix}-gauges`),
  };

  // Rocket-specific elements
  if (prefix === 'rocket') {
    els.pyroBadge = document.getElementById(`${prefix}-pyroBadge`);
  }

  let port, reader, keepReading = false;
  let packetCount = 0, lastPacketTime = 0;
  const trail = [];
  let maxAlt = 0;

  const marker = L.marker([-6.9, 107.6], { icon: emojiIcon(emoji) }).addTo(sharedMap);
  const polyline = L.polyline([], { color: lineColor }).addTo(sharedMap);

  // Chart setup
  const ctx = document.getElementById(`${prefix}-altChart`).getContext('2d');
  const altChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'GPS Alt', data: [], borderColor: lineColor, backgroundColor: lineColor + '20', borderWidth: 2, fill: true, pointRadius: 0, tension: 0.2 },
        { label: 'Baro Alt', data: [], borderColor: lineColor + 'aa', borderDash: [4, 4], backgroundColor: 'transparent', borderWidth: 1.5, fill: false, pointRadius: 0, tension: 0.2 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { min: 0, ticks: { color: '#9aa0ab', font: { size: 10 } }, grid: { color: '#1a212c', drawBorder: false } },
        x: { ticks: { color: '#9aa0ab', font: { size: 10 } }, grid: { color: '#1a212c' } }
      }
    }
  });

  // Gauges
  const altGauge = buildGauge(els.gaugesContainer, 'Alt', 'm', 0, 2000, 0);
  const velGauge = buildGauge(els.gaugesContainer, 'Vel', 'm/s', -50, 150, 1);

  // Horizon indicator
  function drawHorizon(rollDeg, pitchDeg) {
    const c = els.horizon, g = c.getContext('2d');
    const w = c.width, h = c.height, cx = w / 2, cy = h / 2, r = 85;
    g.clearRect(0, 0, w, h);
    g.save();
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.clip();
    g.save();
    g.translate(cx, cy);
    g.rotate(rollDeg * Math.PI / 180);
    const pitchOffset = pitchDeg * 2;
    g.fillStyle = '#3b82f6';
    g.fillRect(-r * 2, -r * 2 + pitchOffset, r * 4, r * 2);
    g.fillStyle = '#8a5a2c';
    g.fillRect(-r * 2, pitchOffset, r * 4, r * 2);
    g.strokeStyle = '#ffffff'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(-r * 2, pitchOffset); g.lineTo(r * 2, pitchOffset); g.stroke();
    g.restore();
    g.restore();
    g.strokeStyle = '#e6e8ee'; g.lineWidth = 2;
    g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = '#facc15'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cx - 22, cy); g.lineTo(cx - 6, cy); g.stroke();
    g.beginPath(); g.moveTo(cx + 6, cy); g.lineTo(cx + 22, cy); g.stroke();
  }
  drawHorizon(0, 0);

  function log(line) {
    els.log.textContent += line + "\n";
    els.log.scrollTop = els.log.scrollHeight;
  }

  function parsePacket(line) {
    line = line.trim();
    if (!line.startsWith('$TLM,')) return;
    const parts = line.split(',');
    if (parts.length < 19) return;

    const [, ms, lat, lon, gpsAlt, sats, pressHpa, baroAlt, baroTemp, roll, pitch, yaw] = parts;

    const flat = parseFloat(lat), flon = parseFloat(lon);
    const numGpsAlt = parseFloat(gpsAlt);
    const numBaroAlt = parseFloat(baroAlt);
    const numRoll = parseFloat(roll);
    const numPitch = parseFloat(pitch);
    const numYaw = parseFloat(yaw);

    els.valGpsAlt.textContent = numGpsAlt.toFixed(1) + ' m';
    els.valBaroAlt.textContent = numBaroAlt.toFixed(1) + ' m';
    els.valSats.textContent = sats;
    els.valPress.textContent = parseFloat(pressHpa).toFixed(1) + ' hPa';
    els.valTemp.textContent = parseFloat(baroTemp).toFixed(1) + ' °C';
    els.valAttitude.textContent = numRoll.toFixed(1) + '° / ' + numPitch.toFixed(1) + '° / ' + numYaw.toFixed(1) + '°';

    // Update gauges
    altGauge.update(numGpsAlt);
    velGauge.update(numGpsAlt > maxAlt ? 10 : -5); // Simplified velocity

    // Update max alt for rocket
    if (numGpsAlt > maxAlt) maxAlt = numGpsAlt;

    drawHorizon(numRoll, numPitch);

    if (flat !== 0 && flon !== 0) {
      marker.setLatLng([flat, flon]);
      trail.push([flat, flon]);
      polyline.setLatLngs(trail);
      if (trail.length === 1) sharedMap.setView([flat, flon], 16);
    }

    const tSec = (parseFloat(ms) / 1000).toFixed(1);
    altChart.data.labels.push(tSec);
    altChart.data.datasets[0].data.push(numGpsAlt);
    altChart.data.datasets[1].data.push(numBaroAlt);
    if (altChart.data.labels.length > 100) {
      altChart.data.labels.shift();
      altChart.data.datasets[0].data.shift();
      altChart.data.datasets[1].data.shift();
    }
    altChart.update('none');

    packetCount++;
    lastPacketTime = Date.now();
    log(line);
  }

  async function connect() {
    if (!('serial' in navigator)) {
      alert('Web Serial not supported. Use Chrome or Edge desktop.');
      return;
    }
    try {
      port = await navigator.serial.requestPort();
      const baud = parseInt(els.baudSelect.value, 10);
      await port.open({ baudRate: baud });
      els.statusPill.textContent = 'Connected';
      els.statusPill.className = 'status connected';
      els.connectBtn.textContent = 'Disconnect';
      keepReading = true;
      readLoop();
    } catch (err) {
      log('Connection error: ' + err.message);
    }
  }

  async function disconnect() {
    keepReading = false;
    if (reader) { try { await reader.cancel(); } catch (e) { } }
    if (port) { try { await port.close(); } catch (e) { } }
    els.statusPill.textContent = 'Disconnected';
    els.statusPill.className = 'status disconnected';
    els.connectBtn.textContent = 'Connect Serial';
  }

  async function readLoop() {
    const textDecoder = new TextDecoderStream();
    port.readable.pipeTo(textDecoder.writable);
    reader = textDecoder.readable.getReader();
    let buffer = '';
    try {
      while (keepReading) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        let idx;
        while ((idx = buffer.indexOf('\n')) >= 0) {
          const line = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 1);
          parsePacket(line);
        }
      }
    } catch (err) {
      log('Read error: ' + err.message);
    } finally {
      reader.releaseLock();
    }
  }

  els.connectBtn.addEventListener('click', () => {
    if (els.connectBtn.textContent === 'Connect Serial') connect();
    else disconnect();
  });

  setInterval(() => {
    if (lastPacketTime > 0) {
      const age = ((Date.now() - lastPacketTime) / 1000).toFixed(1);
      els.packetInfo.textContent = `${packetCount} pkts, last ${age}s ago`;
    }
  }, 500);
}

// Initialize dashboards
createDashboard('cansat', '#2563eb', '🛰️', 'cansat');
createDashboard('rocket', '#dc2626', '🚀', 'rocket');

// ============== CANSAT VIDEO ==============
let cansatVideoStream = null;

async function cansatEnableVideoList() {
  try {
    const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
    tempStream.getTracks().forEach(t => t.stop());

    const devices = await navigator.mediaDevices.enumerateDevices();
    const videoInputs = devices.filter(d => d.kind === 'videoinput');

    const select = document.getElementById('cansat-videoDeviceSelect');
    select.innerHTML = '';
    if (videoInputs.length === 0) {
      select.innerHTML = '<option>No video devices found</option>';
      return;
    }
    videoInputs.forEach((d, i) => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      opt.textContent = d.label || `Camera ${i + 1}`;
      select.appendChild(opt);
    });

    cansatStartVideo(select.value);
  } catch (err) {
    console.error('Video error:', err.message);
  }
}

async function cansatStartVideo(deviceId) {
  if (cansatVideoStream) {
    cansatVideoStream.getTracks().forEach(t => t.stop());
  }
  try {
    cansatVideoStream = await navigator.mediaDevices.getUserMedia({
      video: { deviceId: deviceId ? { exact: deviceId } : undefined }
    });
    document.getElementById('cansat-fpvVideo').srcObject = cansatVideoStream;
  } catch (err) {
    console.error('Video start error:', err.message);
  }
}

document.getElementById('cansat-videoEnableBtn').addEventListener('click', cansatEnableVideoList);
document.getElementById('cansat-videoDeviceSelect').addEventListener('change', (e) => cansatStartVideo(e.target.value));
</script>
